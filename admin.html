<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F-A-R-S-S | Print Shop Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff3;--panel:#fff;--ink:#14263d;--mute:#5a6879;--line:#dbe1e9;--line2:#c8d0db;--c:#0095b6;--cb:#00768f;--m:#d2336b;--y:#f0b400;--ok:#1b8a5a;--bad:#c62828;--navy:#101f33;--sh:0 1px 2px rgba(16,31,51,.06);--n-bg:#e3f2fd;--n-fg:#0d47a1;--p-bg:#fff3cd;--p-fg:#7a5a00;--r-bg:#e0f5ea;--r-fg:#13633f;--d-bg:#e6e9ee;--d-fg:#46515f;--l-bg:#fde4e4;--l-fg:#a11b1b;--disp:Archivo,"IBM Plex Sans",Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1320;--panel:#142137;--ink:#e8eef6;--mute:#94a4b9;--line:#26354c;--line2:#34465f;--cb:#0b88a6;--navy:#08101c;--sh:none;--n-bg:rgba(66,165,245,.16);--n-fg:#8cc8ff;--p-bg:rgba(240,180,0,.16);--p-fg:#f3c94d;--r-bg:rgba(27,138,90,.2);--r-fg:#5fd29b;--d-bg:rgba(148,164,185,.16);--d-fg:#b3c0d2;--l-bg:rgba(198,40,40,.22);--l-fg:#ff9a9a}}
:root[data-theme="dark"]{--bg:#0b1320;--panel:#142137;--ink:#e8eef6;--mute:#94a4b9;--line:#26354c;--line2:#34465f;--cb:#0b88a6;--navy:#08101c;--sh:none;--n-bg:rgba(66,165,245,.16);--n-fg:#8cc8ff;--p-bg:rgba(240,180,0,.16);--p-fg:#f3c94d;--r-bg:rgba(27,138,90,.2);--r-fg:#5fd29b;--d-bg:rgba(148,164,185,.16);--d-fg:#b3c0d2;--l-bg:rgba(198,40,40,.22);--l-fg:#ff9a9a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "IBM Plex Sans",Arial,sans-serif;font-variant-numeric:tabular-nums;min-height:100vh;-webkit-font-smoothing:antialiased}

/* wordmark: the four hyphens are the C, M, Y and K inks */
.wm{display:inline-flex;align-items:center;font-family:var(--disp);font-stretch:125%;font-weight:800;letter-spacing:.02em;line-height:1;white-space:nowrap}
.wm i{display:inline-block;width:.46em;height:.15em;margin:0 .1em;border-radius:1px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.wm i:nth-child(1){background:var(--c)}.wm i:nth-child(2){background:var(--m)}.wm i:nth-child(3){background:var(--y)}.wm i:nth-child(4){background:currentColor}

/* layout */
.app{min-height:100vh}
nav{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
nav .top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px max(24px,calc((100% - 1140px)/2 + 34px))}
.bw{display:flex;align-items:baseline;gap:14px;min-width:0}
.brand{font-size:21px;flex:none}
.bs{color:#8fa1b8;font-size:13px;white-space:nowrap}
.tools{display:flex;align-items:center;gap:2px;flex:none}
.syst{color:#8fa1b8;font-size:12.5px;margin-inline-end:12px;white-space:nowrap}.syst.bad{color:#ffb4b4}
#who{color:#8fa1b8;font-size:12.5px;margin-inline-end:10px;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:0 max(10px,calc((100% - 1140px)/2 + 20px));border-top:1px solid rgba(255,255,255,.1);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
nav button{display:flex;align-items:center;gap:9px;background:none;border:0;color:#bcc9da;font:inherit;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
nav button svg{width:18px;height:18px;flex:none;opacity:.85}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.tabs button{padding:12px 14px;border-bottom:3px solid transparent;border-radius:0}
.tabs button.on{color:#fff;font-weight:600;border-bottom-color:var(--c);background:rgba(255,255,255,.05)}
.tabs button.on svg{opacity:1;color:#4fd0ea}
.tools button{width:36px;height:36px;padding:0;justify-content:center;border-radius:8px}
main{padding:30px 34px 40px;max-width:1140px;width:100%;margin:0 auto}
h1{font:700 25px/1.2 var(--disp);letter-spacing:-.01em;margin:0 0 6px}
h2{font:600 16px/1.3 var(--disp);margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 22px;max-width:68ch}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:20px;margin-bottom:16px}

/* key numbers as one connected strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh);margin-bottom:16px}
.kpi{background:var(--panel);padding:16px 18px 15px}
.kpi::before{content:"";display:block;width:22px;height:4px;border-radius:2px;background:var(--c);margin-bottom:12px}
.kpi:nth-child(2)::before{background:var(--y)}.kpi:nth-child(3)::before{background:var(--m)}.kpi:nth-child(4)::before{background:var(--ok)}
.kpi b{display:block;font:700 26px/1.2 var(--disp);letter-spacing:-.01em;overflow-wrap:anywhere}
.kpi span{color:var(--mute);font-size:13px}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:11px 14px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--mute);font-size:13px;border-bottom-color:var(--line2)}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(0,149,182,.06)}

/* forms */
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:9px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--c);outline-offset:0;border-color:var(--c)}
button:focus-visible{outline:2px solid var(--c);outline-offset:2px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 12px}
.btn{background:var(--cb);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;transition:filter .12s,background .12s}
.btn:hover{filter:brightness(1.1)}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line2)}.btn.g:hover{background:var(--bg);filter:none}
.btn.d{background:var(--bad)}.btn.s{padding:5px 11px;font-size:13px}
.search{max-width:300px}

/* status tags */
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600}
.s-new{background:var(--n-bg);color:var(--n-fg)}.s-prod{background:var(--p-bg);color:var(--p-fg)}.s-ready{background:var(--r-bg);color:var(--r-fg)}.s-done{background:var(--d-bg);color:var(--d-fg)}.s-late{background:var(--l-bg);color:var(--l-fg)}

/* dialogs */
.modal{position:fixed;inset:0;background:rgba(8,16,28,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:28px 12px;z-index:50}
.modal.open{display:flex}
.box{background:var(--panel);border-radius:14px;padding:24px;width:100%;max-width:680px;box-shadow:0 24px 64px rgba(0,0,0,.28)}
.mut{color:var(--mute)}.neg{color:var(--bad);font-weight:600}.pos{color:var(--ok);font-weight:600}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.res div{background:var(--bg);border-radius:10px;padding:11px 14px}.res b{display:block;font:700 19px/1.4 var(--disp)}
.inv{background:#fff;color:#111;padding:28px;border-radius:6px}.inv table{min-width:0}.inv th{color:#555}.inv h2{margin-bottom:4px}
.empty{padding:34px;text-align:center;color:var(--mute)}
[hidden]{display:none!important}
body.locked .app{display:none}

/* production board */
.kan{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:rgba(120,135,158,.07);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:12px;min-height:240px}
.kcol:nth-child(2){border-top-color:var(--y)}.kcol:nth-child(3){border-top-color:var(--ok)}.kcol:nth-child(4){border-top-color:var(--line2)}
.kcol h2{font-size:15px;margin-bottom:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--sh)}
.card.lt{border-inline-start:4px solid var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 12px}
.chip button{border:0;background:none;color:var(--bad);cursor:pointer;font-size:16px;line-height:1;padding:0 0 0 4px}

/* chart */
.bars{display:flex;gap:12px;height:176px}
.bar1{display:flex;flex-direction:column;flex:1;height:100%;align-items:center;font-size:12px;color:var(--mute)}
.bar1 b{color:var(--ink);font-weight:600}
.col{flex:1;width:100%;display:flex;align-items:flex-end}
.col i{width:100%;background:var(--c);border-radius:5px 5px 0 0;min-height:2px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:16px}

/* sign in */
#auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.aside{background:var(--navy);color:#fff;padding:52px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.aside .wm{font-size:clamp(34px,4.6vw,64px);position:relative}
.aside p{color:#9fb0c5;max-width:30ch;margin:0;position:relative;font-size:16px}
.aside svg{position:absolute;right:-90px;bottom:-90px;width:420px;height:420px;color:#fff;opacity:.09}
.aform{display:flex;align-items:center;justify-content:center;padding:32px 24px}
.acard{width:100%;max-width:360px}
.acard h2{font-size:26px;letter-spacing:-.01em;margin-bottom:6px}

@media(max-width:860px){
 nav{position:static}
 nav .top{padding:10px 14px}.bs,#who,.syst{display:none}.brand{font-size:18px}
 .tabs{padding:0 6px}
 main{padding:18px 14px 32px}
 .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.kpi b{font-size:22px}
 .two{grid-template-columns:1fr}
 #auth{grid-template-columns:1fr;min-height:100vh;align-content:start}
 .aside{padding:28px 24px;gap:10px}.aside p,.aside svg{display:none}.aside .wm{font-size:34px}
 .aform{padding:28px 20px}
}
@media print{body{background:#fff}.noprint{display:none!important}.app{display:none}.modal{position:static;display:none;padding:0;background:none}.modal.print{display:block}.box{max-width:none;padding:0;box-shadow:none;border-radius:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<nav>
 <div class="top">
  <div class="bw"><div class="brand"><span class="wm" role="img" aria-label="F-A-R-S-S">F<i></i>A<i></i>R<i></i>S<i></i>S</span></div><div class="bs">Print shop manager</div></div>
  <div class="tools">
   <span id="syncst" class="syst"></span><div id="who"></div>
   <button id="theme" title="Dark mode" aria-label="Dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
   <button id="bk" title="Export backup" aria-label="Export backup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
   <button id="rs" title="Restore backup" aria-label="Restore backup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg></button>
   <button id="lo" title="Log out" aria-label="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
  </div>
 </div>
 <div class="tabs">
  <button data-v="dash" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Dashboard</button>
  <button data-v="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>Orders</button>
  <button data-v="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/></svg>Production board</button>
  <button data-v="cust"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Customers</button>
  <button data-v="price"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h.01M16 19h.01"/></svg>Price calculator</button>
  <button data-v="sizes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.3 8.7 8.7 21.3a1 1 0 0 1-1.4 0L2.7 16.7a1 1 0 0 1 0-1.4L15.3 2.7a1 1 0 0 1 1.4 0l4.6 4.6a1 1 0 0 1 0 1.4Z"/><path d="m7.5 10.5 2 2M10.5 7.5l2 2M13.5 4.5l2 2M4.5 13.5l2 2"/></svg>Size library</button>
  <button data-v="users" id="nu" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>Users</button>
  <button data-v="sync"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 0-15.5-6.2L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15.5 6.2L21 16"/><path d="M16 16h5v5"/></svg>Sync</button>
 </div>
</nav>
<main id="main"></main>
</div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<input type="file" id="file" accept=".json" hidden>
<div id="auth" hidden></div>
<script>
const TYPES=["Sticker","Acetate","Thermal barcode","Hang tag","Care label","Carton label"];
const DEF={cust:[],orders:[],seq:1,setup:150,min:200,
 rates:{"Sticker":0.012,"Acetate":0.02,"Thermal barcode":0.008,"Hang tag":0.015,"Care label":0.018,"Carton label":0.01},
 mats:{"Art paper":1,"Glossy coated":1.1,"Matte coated":1.1,"Thermal paper":0.9,"Kraft":1.2,"Cardboard 300g":1.25,"Satin":1.3,"PP synthetic":1.4,"PVC vinyl":1.5,"Transparent":1.6},
 cols:{"1 color":0.8,"2 colors":0.9,"CMYK":1,"CMYK + spot":1.2},
 fin:{"None":0,"Varnish":0.08,"Die-cut":0.1,"Numbering / variable data":0.12,"Lamination":0.15,"Foil":0.3},
 sizes:{"Sticker":[[3,2],[3,3],[4,4],[5,3],[5,5],[7,5],[10,5],[10,10]],
  "Acetate":[[5,3],[6,4],[8,5],[10,6],[10,10],[15,10]],
  "Thermal barcode":[[5,2.5],[6,4],[10,5],[10,7.5],[10,10],[10,15]],
  "Hang tag":[[4,9],[5,9],[5,10],[6,10],[6,12],[7,15]],
  "Care label":[[3,6],[4,8],[5,10]],
  "Carton label":[[10,10],[10,15],[15,10],[15,15],[20,10],[20,15]]}};
const ST={new:["New","s-new"],prod:["In production","s-prod"],ready:["Ready","s-ready"],done:["Delivered","s-done"]};
const KEY="ceaser_labels_v1";
const clone=o=>JSON.parse(JSON.stringify(o));
let S=clone(DEF);
function norm(){
 for(const k of ["rates","mats","cols","fin","sizes"])S[k]=Object.assign(clone(DEF[k]),S[k]);
 delete S.rates["Garment tag"];delete S.sizes["Garment tag"];
 S.orders.forEach(o=>{if(o.type==="Garment tag")o.type="Hang tag"});
}
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
norm();

/* ---------- Cloud sync (JSONBin) ---------- */
const lsSave=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const save=()=>{stamp();lsSave();schedSync()};
const SK="farss_sync_v1",SBASE="https://api.jsonbin.io/v3/b/",SETK=["rates","mats","cols","fin","sizes","setup","min"];
let SY={bin:"",key:"",last:0,ok:null,msg:"",size:0,busy:false,again:false};
try{Object.assign(SY,JSON.parse(localStorage.getItem(SK)||"{}"))}catch(e){}
SY.busy=false;SY.again=false;
const saveSY=()=>{try{localStorage.setItem(SK,JSON.stringify({bin:SY.bin,key:SY.key,last:SY.last}))}catch(e){}};
const syOn=()=>!!(SY.bin&&SY.key);
const rec=o=>{const c=Object.assign({},o);delete c._u;return JSON.stringify(c)};
const setj=()=>JSON.stringify(SETK.map(k=>S[k]));
const byId=(a,b)=>a.id<b.id?-1:a.id>b.id?1:0;
let CACHE={},KNOWN={},SETJ="",ST_T=null;
function prime(){CACHE={};KNOWN={};for(const o of S.orders.concat(S.cust)){CACHE[o.id]=rec(o);KNOWN[o.id]=1}SETJ=setj()}
function stamp(){
 const now=Date.now(),cur={};S.del=S.del||{};
 for(const o of S.orders.concat(S.cust)){cur[o.id]=1;const j=rec(o);if(CACHE[o.id]!==j){o._u=now;CACHE[o.id]=j}}
 for(const id in KNOWN)if(!cur[id]){S.del[id]=now;delete CACHE[id]}
 KNOWN=cur;
 const sj=setj();if(sj!==SETJ){S.setU=now;SETJ=sj}
}
function payload(){
 const dl={};Object.keys(S.del||{}).sort().forEach(k=>dl[k]=S.del[k]);
 const set={};for(const k of SETK)set[k]=S[k];
 return{app:"farss",v:1,d:{cust:S.cust,orders:S.orders,seq:S.seq,del:dl,setU:S.setU||0,set}};
}
function merge(r){
 if(!r||!r.d)return;
 const R=r.d,now=Date.now(),del=Object.assign({},S.del||{});
 for(const id in(R.del||{}))del[id]=Math.max(del[id]||0,R.del[id]);
 for(const id in del)if(now-del[id]>90*864e5)delete del[id];
 const pick=(a,b)=>{const m=new Map();for(const o of a)m.set(o.id,o);
  for(const o of(b||[])){const x=m.get(o.id);if(!x||(o._u||0)>(x._u||0))m.set(o.id,o)}
  return[...m.values()].filter(o=>!(del[o.id]&&del[o.id]>=(o._u||0))).sort(byId)};
 S.cust=pick(S.cust,R.cust);S.orders=pick(S.orders,R.orders);S.del=del;
 if((R.setU||0)>(S.setU||0)&&R.set){for(const k of SETK)if(R.set[k]!==undefined)S[k]=R.set[k];S.setU=R.setU;norm()}
 S.seq=Math.max(S.seq||1,R.seq||1,S.orders.reduce((m,o)=>Math.max(m,o.no||0),0)+1);
 prime();
 const used=new Set();
 [...S.orders].sort((a,b)=>(a.no-b.no)||String(a.date||"").localeCompare(String(b.date||""))||byId(a,b)).forEach(o=>{

 if(e&&e.http){if(/exhaust/i.test(e.msg||""))return"The JSONBin request quota is used up. Wait for the quota to reset or upgrade the plan.";
  if(e.http===401||e.http===403)return"The access key was rejected. Check the key and that it can read and update bins.";
  if(e.http===404)return"Bin not found. Check the Bin ID.";

   if(SY.size>100*1024)throw{size:"The data is over the 100 KB limit of the free JSONBin plan. Export a backup and remove old orders, or upgrade the JSONBin plan."};

 <div><label>Height (cm)</label><input id="oh" type="number" step="0.1" value="${o.h}" oninput="oCust()"></div>
 <div><label>Quantity</label><input id="oq" type="number" value="${o.qty}" oninput="oAuto()"></div>
 <div><label>Material</label><select id="om" onchange="oAuto()">${opts(Object.keys(S.mats),mat)}</select></div>
 <div><label>Colors</label><select id="ok" onchange="oAuto()">${opts(Object.keys(S.cols),col)}</select></div>
 <div><label>Finish</label><select id="of" onchange="oAuto()">${opts(Object.keys(S.fin),fin)}</select></div>
 <div><label>Extra discount (%)</label><input id="odc" type="number" min="0" max="100" step="0.5" value="${o.disc||0}" oninput="oAuto()"></div>
 <div><label>Priority</label><select id="opr"><option value="normal" ${o.pri!=="urgent"?"selected":""}>Normal</option><option value="urgent" ${o.pri==="urgent"?"selected":""}>Urgent</option></select></div>
 <div style="display:flex;align-items:end"><label style="display:flex;gap:8px;align-items:center;margin:0 0 10px;color:var(--ink)"><input id="ov" type="checkbox" style="width:auto" ${o.vat?"checked":""} onchange="oAuto()"> Add 14% VAT</label></div>
 <div><label>Total (EGP)</label><input id="ot2" type="number" step="0.01" value="${o.total||""}"></div>
 <div><label>Paid (EGP)</label><input id="op" type="number" step="0.01" value="${o.paid}"></div>
 <div><label>Due date</label><input id="od" type="date" value="${o.due}"></div>
 <div><label>Status</label><select id="os">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${k===o.status?"selected":""}>${v[0]}</option>`).join("")}</select></div></div>
 <div class="mut" id="ohint" style="margin-top:8px"></div>
 <div style="margin-top:12px"><label>Notes (job name, artwork file, special instructions)</label><textarea id="on" rows="2">${esc(o.notes)}</textarea></div>
 <div class="bar" style="margin:16px 0 0"><button class="btn" onclick="orderSave('${id||""}')">Save order</button><button class="btn g" onclick="close()">Cancel</button>${id&&isAdmin()?`<button class="btn d" style="margin-inline-start:auto" onclick="orderDel('${id}')">Delete</button>`:""}</div>`);
 if(!id)oAuto();
}
function oType(){$("#osz").innerHTML=sizeOpts($("#ot").value,+$("#ow").value,+$("#oh").value);oAuto()}
function oSize(){const v=$("#osz").value;if(v!=="c"){const s=S.sizes[$("#ot").value][+v];$("#ow").value=s[0];$("#oh").value=s[1]}oAuto()}
function oCust(){$("#osz").innerHTML=sizeOpts($("#ot").value,+$("#ow").value,+$("#oh").value);oAuto()}
function oAuto(){const r=calc($("#ot").value,+$("#ow").value||0,+$("#oh").value||0,+$("#oq").value||0,$("#om").value,$("#ok").value,$("#of").value);
 let t=r.total*(1-(+$("#odc").value||0)/100);if($("#ov").checked)t*=1+VAT;
 $("#ot2").value=Math.round(t*100)/100;
 $("#ohint").textContent="Auto price: EGP "+r.unit.toFixed(3)+" per piece"+(r.tier?" · quantity discount "+Math.round(r.tier*100)+"%":"")+". You can still edit the total manually."}
function orderSave(id){
 const d={cid:$("#oc").value,type:$("#ot").value,w:+$("#ow").value||0,h:+$("#oh").value||0,qty:+$("#oq").value||0,mat:$("#om").value,col:$("#ok").value,fin:$("#of").value,disc:+$("#odc").value||0,pri:$("#opr").value,vat:$("#ov").checked,total:+$("#ot2").value||0,paid:+$("#op").value||0,due:$("#od").value,status:$("#os").value,notes:$("#on").value.trim()};
 if(d.qty<=0){$("#oq").focus();return}
 if(id)Object.assign(S.orders.find(x=>x.id===id),d);else S.orders.push(Object.assign({id:uid(),no:S.seq++,date:today()},d));
 save();close();render()}
function orderDel(id){if(!isAdmin())return;if(confirm("Delete this order?")){S.orders=S.orders.filter(o=>o.id!==id);save();close();render()}}
function pay(id){const o=S.orders.find(x=>x.id===id),bal=o.total-o.paid;if(bal<=0.001){alert("This order is fully paid.");return}
 const v=prompt("Payment amount (EGP). Balance: "+bal.toFixed(2),bal.toFixed(2));if(v===null)return;const a=+v;
 if(!(a>0)||a>bal+0.001){alert("Enter an amount between 0 and the balance.");return}
 o.paid=Math.round((o.paid+a)*100)/100;save();render()}
function csv(){
 const h=["No","Date","Customer","Type","Material","Colors","Finish","Width","Height","Qty","Total","Paid","Balance","Due","Status","Notes"];
 const r=S.orders.map(o=>[o.no,o.date,cname(o.cid),o.type,o.mat||"",o.col||"",o.fin||"",o.w,o.h,o.qty,o.total,o.paid,Math.round((o.total-o.paid)*100)/100,o.due,ST[o.status][0],o.notes||""]);
 const cell=v=>{v=String(v??"");if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};
 const c=[h,...r].map(a=>a.map(cell).join(",")).join("\r\n");
 const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent("\ufeff"+c);a.download="orders-"+today()+".csv";a.click()}

function invoice(id){
 const o=S.orders.find(x=>x.id===id),c=S.cust.find(x=>x.id===o.cid)||{name:"-",phone:""};
 const net=o.vat?o.total/(1+VAT):o.total,vat=o.total-net;
 open(`<div class="inv"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h2 style="margin:0"><span class="wm" style="font-size:24px" role="img" aria-label="F-A-R-S-S">F<i></i>A<i></i>R<i></i>S<i></i>S</span></h2><div>El Quds School St, Third Al Montazah, Alexandria</div><div>010 04412327</div></div><div><b>Invoice #${o.no}</b><div>Date: ${o.date}</div></div></div><hr>
 <p><b>Customer:</b> ${esc(c.name)} ${c.phone?" - "+esc(c.phone):""}</p>
 <table><tr><th>Item</th><th>Size</th><th>Qty</th><th>Unit price</th><th>Amount</th></tr><tr><td>${esc(o.type)}<br><small>${esc([o.mat,o.col,o.fin&&o.fin!=="None"?o.fin:""].filter(Boolean).join(" · "))}${o.notes?"<br>"+esc(o.notes):""}</small></td><td>${o.w}×${o.h} cm</td><td>${num(o.qty)}</td><td>${(net/o.qty).toFixed(3)}</td><td>${money(net)}</td></tr></table>
 <p style="text-align:right;margin-top:14px">${o.disc?`Discount applied: ${o.disc}%<br>`:""}${o.vat?`VAT 14%: ${money(vat)}<br>`:""}Total: <b>${money(o.total)}</b><br>Paid: <b>${money(o.paid)}</b><br>Balance due: <b>${money(o.total-o.paid)}</b></p>
 ${o.due?`<p>Delivery date: ${o.due}</p>`:""}</div>
 <div class="bar noprint" style="margin:14px 0 0"><button class="btn" onclick="window.print()">Print</button><button class="btn g" onclick="close()">Close</button></div>`,"print");
}

document.querySelectorAll("nav [data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;q="";fs="all";render()});
$("#modal").onclick=e=>{if(e.target.id==="modal")close()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
$("#theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
$("#bk").onclick=()=>{const a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S));a.download="farss-"+today()+".json";a.click()};
$("#rs").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.orders)||!Array.isArray(d.cust))throw 0;S=Object.assign(S,d);norm();save();render()}catch(x){alert("This file is not a valid backup.")}};r.readAsText(f);e.target.value=""};

/* ---------- Authentication ---------- */
const UK="ceaser_users_v1",UOK=/^[a-z0-9._-]{3,30}$/;
let U=[];try{U=JSON.parse(localStorage.getItem(UK)||"[]")}catch(e){}
const saveU=()=>{try{localStorage.setItem(UK,JSON.stringify(U))}catch(e){}};
let me=null,fails=0,lockUntil=0;
try{me=sessionStorage.getItem("ceaser_sess")}catch(e){}
const isAdmin=()=>{const u=U.find(x=>x.u===me);return !!u&&u.role==="admin"};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const hasCrypto=()=>!!(window.crypto&&crypto.subtle);
const newSalt=()=>hex(crypto.getRandomValues(new Uint8Array(16)));
async function hp(p,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"]);return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations:150000,hash:"SHA-256"},k,256))}
function authScreen(){
 document.body.classList.add("locked");
 const first=false;
 $("#auth").innerHTML=`<aside class="aside"><span class="wm" role="img" aria-label="F-A-R-S-S">F<i></i>A<i></i>R<i></i>S<i></i>S</span><p>Orders, production and pricing for the print shop.</p><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke-width=".15"/><circle cx="12" cy="12" r="6.5" stroke-width=".15"/><circle cx="12" cy="12" r="2.5" stroke-width=".15"/><path d="M12 0v24M0 12h24" stroke-width=".15"/></svg></aside><div class="aform"><div class="acard">
 <h2>${first?"Create admin account":"Sign in"}</h2><p class="mut" style="margin-top:0">${first?"First launch: choose the admin username and password.":"Enter your credentials to continue."}</p>
 <label>Username</label><input id="au" autocomplete="username" autocapitalize="none">
 <label style="margin-top:10px">Password</label><input id="ap" type="password" autocomplete="${first?"new-password":"current-password"}">
 ${first?'<label style="margin-top:10px">Confirm password</label><input id="ac" type="password" autocomplete="new-password">':""}
 <div class="neg" id="ae" style="min-height:24px;margin:8px 0"></div>
 <button class="btn" style="width:100%" id="ago">${first?"Create account":"Sign in"}</button></div></div>`;
 $("#auth").hidden=false;
 $("#ago").onclick=()=>doAuth(first);
 $("#auth").onkeydown=e=>{if(e.key==="Enter")doAuth(first)};
 $("#au").focus();
}
async function doAuth(first){
 const u=$("#au").value.trim().toLowerCase(),p=$("#ap").value,e=$("#ae");
 if(first){
  if(!UOK.test(u)){e.textContent="Username: 3-30 letters, numbers, dot, dash or underscore.";return}
  if(p.length<8){e.textContent="Password must be at least 8 characters.";return}
  if(p!==$("#ac").value){e.textContent="Passwords do not match.";return}
  const salt=newSalt();U.push({u,salt,hash:await hp(p,salt),role:"admin"});saveU();return enter(u);
 }
 if(Date.now()<lockUntil){e.textContent="Too many attempts. Try again in "+Math.ceil((lockUntil-Date.now())/1000)+"s.";return}
 const ok=u==="admin"&&p==="admin";
 if(ok&&!U.some(x=>x.u==="admin")){U.push({u:"admin",salt:"",hash:"",role:"admin"});saveU()}
 if(!ok){if(++fails>=5){fails=0;lockUntil=Date.now()+30000}e.textContent="Wrong username or password.";return}
 fails=0;enter(u);
}
function enter(u){me=u;try{sessionStorage.setItem("ceaser_sess",u)}catch(e){}
 $("#auth").hidden=true;$("#auth").innerHTML="";document.body.classList.remove("locked");
 $("#nu").hidden=!isAdmin();$("#rs").hidden=!isAdmin();$("#who").textContent="Signed in: "+u+" ("+(isAdmin()?"admin":"staff")+")";
 view="dash";q="";fs="all";render();syUI();if(syOn())syncNow()}
function logout(){me=null;try{sessionStorage.removeItem("ceaser_sess")}catch(e){}close();authScreen()}
$("#lo").onclick=logout;

function users(){
 if(!isAdmin())return'<div class="empty">Admins only.</div>';
 return`<h1>Users</h1><p class="sub">Manage who can sign in. Staff can't delete records, manage users or restore backups.</p>
 <div class="panel"><h2>Add user</h2><div class="grid"><div><label>Username</label><input id="nu1" autocomplete="off" autocapitalize="none"></div><div><label>Password (min 8)</label><input id="np1" type="password" autocomplete="new-password"></div><div><label>Role</label><select id="nr"><option value="staff">Staff</option><option value="admin">Admin</option></select></div></div>
 <div class="neg" id="ue" style="min-height:24px;margin:8px 0"></div><button class="btn" onclick="userAdd()">Add user</button></div>
 <div class="panel tw"><table><tr><th>Username</th><th>Role</th><th></th></tr>${U.map(x=>`<tr><td>${esc(x.u)}${x.u===me?' <span class="mut">(you)</span>':""}</td><td>${x.role}</td><td><button class="btn g s" onclick="userPw('${x.u}')">Reset password</button> ${x.u!==me?`<button class="btn d s" onclick="userDel('${x.u}')">Delete</button>`:""}</td></tr>`).join("")}</table></div>`;
}
async function userAdd(){
 if(!isAdmin())return;
 const u=$("#nu1").value.trim().toLowerCase(),p=$("#np1").value,e=$("#ue");
 if(!UOK.test(u)){e.textContent="Username: 3-30 letters, numbers, dot, dash or underscore.";return}
 if(U.some(x=>x.u===u)){e.textContent="That username already exists.";return}
 if(p.length<8){e.textContent="Password must be at least 8 characters.";return}
 const salt=newSalt();U.push({u,salt,hash:await hp(p,salt),role:$("#nr").value});saveU();render();
}
async function userPw(u){
 if(!isAdmin())return;
 const p=prompt("New password for "+u+" (min 8 characters):");
 if(p===null)return;if(p.length<8){alert("Password must be at least 8 characters.");return}
 const rec=U.find(x=>x.u===u);rec.salt=newSalt();rec.hash=await hp(p,rec.salt);saveU();alert("Password updated.");
}
function userDel(u){
 if(!isAdmin()||u===me)return;
 if(confirm("Delete user "+u+"?")){U=U.filter(x=>x.u!==u);saveU();render()}
}

if(me&&U.some(x=>x.u===me))enter(me);else authScreen();
</script>
</body>
</html>
